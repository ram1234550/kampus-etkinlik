<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Güncelle</title>
    <link rel="stylesheet" href="css/2616501812.css">
</head>
<body>
    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Detay</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <form action="etkinlik-detay.html" method="get">
            <p>
                <label for="ad">Etkinlik Adı</label><br>
                <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="">Seçiniz</option>
                    <option value="seminer" selected>Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konser">Konser</option>
                    <option value="spor">Spor</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih</label><br>
                <input type="date" id="tarih" name="tarih" value="2026-10-12" required>
            </p>

            <p>
                <label for="saat">Saat</label><br>
                <input type="time" id="saat" name="saat" value="14:00" required>
            </p>

            <p>
                <label for="yer">Yer</label><br>
                <input type="text" id="yer" name="yer" value="A Blok Konferans Salonu" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="5" cols="40" required>Farklı sektörlerden konuşmacılar kariyer planlama, CV hazırlama ve staj fırsatları hakkında bilgi verecek.</textarea>
            </p>

            <button type="submit">Güncelle</button>
        </form>
    </main>

    <footer>
        <p>Raimberdi Aitmamatov · 2616501812 · 2026</p>
    </footer>
</body>
</html>
